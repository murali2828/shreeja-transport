# pgBackRest — ops-kit Postgres container (every tier; the stanza is always
# "main", the tier is the repository directory it runs in).
#
# repo1 = the host directory bind-mounted at /backups (ops/bin/backup.sh
#         picks <BACKUP_DIR>/pg-<tier>). Off-box copies + an optional S3/MinIO
#         repo2 are configured in conf.d/*.conf (see ops/docs/backup-restore.md).
#
# The database role pgBackRest connects as is passed by the container env
# (PGBACKREST_PG1_USER = the tier's POSTGRES_USER), since the official image
# names its superuser after POSTGRES_USER, not "postgres".
[global]
repo1-path=/backups
# Keep 4 full backups (one per week → ~4 weeks of PITR) and 14 differentials.
repo1-retention-full=4
repo1-retention-diff=14
# Retain enough archived WAL to restore ANY retained backup to ANY point.
repo1-retention-archive-type=full
# conf.d/*.conf (NAS repo2, S3 repo) is picked up automatically: pgBackRest's
# default config-include-path is /etc/pgbackrest/conf.d. The option itself is
# command-line only and must NOT appear here (it is ignored with a warning
# that also corrupts `info --output=json`).
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
# WAL push is queued through the spool so a slow repo never stalls Postgres.
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
start-fast=y
delta=y

[main]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-port=5432
