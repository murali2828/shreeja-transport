server {
    listen 80;
    server_name _;

    # Security headers ("always" so they apply to every response incl. errors).
    # NOTE: nginx add_header does NOT inherit into locations that declare their
    # own add_header — the static-asset block below repeats these deliberately.
    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         SAMEORIGIN always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json
                    application/javascript text/javascript text/xml
                    application/xml image/svg+xml application/wasm;

    client_max_body_size 20M;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached — a stale shell after a deploy points
        # at purged hashed bundles (white screen).
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options  nosniff always;
        add_header X-Frame-Options         SAMEORIGIN always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options  nosniff always;
        add_header X-Frame-Options         SAMEORIGIN always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       keep-alive;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
        access_log off;
    }
}
