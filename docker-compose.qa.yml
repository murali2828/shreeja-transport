version: '3.9'

# ============================================================
# QA / staging stack — fully isolated from production.
# Run with:
#   docker compose -p shreeja-qa --env-file .env.qa -f docker-compose.qa.yml up -d --build
# Separate DB, volumes, network and host port (8081) so it can run on the
# SAME server as production (8080) without any collision.
# A host reverse proxy maps qatms.shreejamilk.com -> 127.0.0.1:8081
# (see deploy/reverse-proxy.conf.example).
# ============================================================

services:

  db:
    # Postgres 16 (Alpine, as before) + pgBackRest: every WAL segment is
    # archived within 60 s, so the database can be restored to any minute
    # (ops/README.md, docs/BACKUP_RESTORE_STRATEGY.md).
    build:
      context: ./ops/postgres
      args:
        BASE_IMAGE: postgres:16-alpine
    image: shreeja-qa-db
    command: ["postgres", "-c", "shared_buffers=256MB",
              "-c", "statement_timeout=60000",
              "-c", "idle_in_transaction_session_timeout=300000",
              "-c", "wal_level=replica",
              "-c", "archive_mode=on",
              "-c", "archive_command=pgbackrest --stanza=main archive-push %p",
              "-c", "archive_timeout=60"]
    container_name: shreeja-qa-db
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    environment:
      POSTGRES_DB:       ${DB_NAME:-dairy_transport_qa}
      POSTGRES_USER:     ${DB_USER:-shreeja_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ:                Asia/Kolkata
      PGTZ:              Asia/Kolkata
      PGBACKREST_PG1_USER: ${DB_USER:-shreeja_db}
    volumes:
      - qa-pgdata:/var/lib/postgresql/data
      - ${BACKUP_DIR:-/home/chaitanya/tms-backups}/pg-qa:/backups               # pgBackRest repo1
      - ${BACKUP_NAS_DIR:-/home/chaitanya/tms-backups/nas}/pg-qa:/nas          # repo2 only if conf.d/nas-repo.conf exists
      - ./ops/postgres/conf.d:/etc/pgbackrest/conf.d:ro                       # cipher.conf (git-ignored)
    networks:
      - shreeja-qa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shreeja_db} -d ${DB_NAME:-dairy_transport_qa}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: shreeja-qa-backend                 # = the name compose already gave it; backed up nightly
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}   # reported by /api/health; ops/bin/deploy.sh exports it
    container_name: shreeja-qa-backend
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    env_file: .env.qa
    environment:
      NODE_ENV: production
      DB_HOST:  db
      DB_PORT:  5432
      PORT:     5000
      UPLOAD_DIR: /app/uploads/documents
      TZ: Asia/Kolkata
    volumes:
      - qa-docuploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shreeja-qa-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: shreeja-qa-frontend                 # = the name compose already gave it; backed up nightly
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shreeja-qa-frontend
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shreeja-qa-net

volumes:
  qa-pgdata:
    name: shreeja-qa-pgdata
  qa-docuploads:
    name: shreeja-qa-docuploads

networks:
  shreeja-qa-net:
    name: shreeja-qa-network
    driver: bridge
